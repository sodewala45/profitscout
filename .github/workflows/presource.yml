# "Find suppliers" button on tikprofitpro.shop/admin/upload starts this.
# You can also start it by hand: GitHub > Actions > Find suppliers > Run workflow.
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_KEY (service_role), OXYLABS_WEB_API_KEY (Oxylabs Web API key, the only Oxylabs login).
# The run FAILS (red) when Oxylabs refuses the key or the quota is used up (exit 3), or when every
# product failed (exit 4). Hitting max_requests is a normal stop (green, with a warning).
name: Find suppliers
run-name: Find suppliers (${{ inputs.mode }}, max ${{ inputs.max_requests }}) ${{ inputs.started_by }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "new = products never sourced, all = redo every active product"
        type: choice
        options: [new, all]
        default: new
      max_requests:
        description: "Max paid Oxylabs results this run"
        default: "1500"
      limit:
        description: "Max products (0 = no limit)"
        default: "0"
      started_by:
        description: "Who started it"
        default: ""

permissions:
  contents: read

concurrency:
  group: presource
  cancel-in-progress: false

jobs:
  presource:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OXYLABS_WEB_API_KEY: ${{ secrets.OXYLABS_WEB_API_KEY }}
      SOURCING_MIN_SIMILARITY: ${{ vars.SOURCING_MIN_SIMILARITY || '0.80' }}
      SOURCING_REVIEW_MIN_SIMILARITY: ${{ vars.SOURCING_REVIEW_MIN_SIMILARITY || '0.60' }}
      SOURCING_MATCHING: ${{ vars.SOURCING_MATCHING || 'off' }}
      SOURCING_KEEP_TOP: ${{ vars.SOURCING_KEEP_TOP || '3' }}
      SOURCING_WORKERS: '1'           # one product at a time (user, 2026-11-14)
      SOURCING_AE_CONCURRENCY: '1'
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            sourcing
            requirements-presource.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-presource.txt

      - name: Cache image model
        if: ${{ vars.SOURCING_MATCHING == 'on' }}    # CLIP is only loaded when photo matching is on
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/clip
            ~/.cache/torch
          key: clip-vit-b-32-v1

      - name: Install
        run: pip install -r requirements-presource.txt

      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repo secret $v is missing"; exit 1; fi
          done
          if [ -z "$OXYLABS_WEB_API_KEY" ]; then
            echo "::error::Repo secret OXYLABS_WEB_API_KEY is missing or empty. Add the API key of your Oxylabs Web API instance (Settings > Secrets and variables > Actions > New repository secret). Username/password is no longer used."
            exit 1
          fi
          echo "Secrets present: SUPABASE_URL, SUPABASE_KEY, OXYLABS_WEB_API_KEY (values hidden)"

      - name: Find suppliers
        # Inputs arrive through env, never pasted into the script, and are validated before use
        # (a dispatch with max_requests="1; curl ..." used to run that command with the secrets).
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_MAX_REQUESTS: ${{ inputs.max_requests }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if ! [[ "$IN_MAX_REQUESTS" =~ ^[0-9]{1,5}$ ]]; then echo "::error::max_requests must be a number"; exit 1; fi
          if ! [[ "$IN_LIMIT" =~ ^[0-9]{1,6}$ ]]; then echo "::error::limit must be a number"; exit 1; fi
          ARGS=(--max-requests "$IN_MAX_REQUESTS")
          case "$IN_MODE" in
            all) ARGS+=(--stale-days 0) ;;
            new) ARGS+=(--new) ;;
            *) echo "::error::mode must be new or all"; exit 1 ;;
          esac
          if [ "$IN_LIMIT" != "0" ]; then ARGS+=(--limit "$IN_LIMIT"); fi
          echo "python -m sourcing.presource ${ARGS[*]}"
          # pipefail (set above) makes the step fail with presource's own exit code, not tee's.
          python -m sourcing.presource "${ARGS[@]}" 2>&1 | tee presource.log

      - name: Summary
        if: always()
        run: |
          echo "### Find suppliers" >> $GITHUB_STEP_SUMMARY
          { grep -E "^(STOPPED|::error::|::warning::|\{'done')" presource.log 2>/dev/null | sed 's/^::[a-z]*:://' || true; } >> $GITHUB_STEP_SUMMARY
          tail -n 3 presource.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No log" >> $GITHUB_STEP_SUMMARY
